[package]
name = "vormcraft"
version = "0.1.0"
description = "VormCraft: a free push/pull 3D modeler"
authors = ["Ben Dobbs"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "vormcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
