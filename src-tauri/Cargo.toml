[package]
name = "benup"
version = "0.1.0"
description = "Benup: a SketchUp-style direct 3D modeler"
authors = ["Benup"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "benup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
