<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VormCraft</title>
    <meta name="description" content="A free, fast, direct 3D modeler: draw a shape, grab a face, push it." />
    <meta name="theme-color" content="#f3f3f2" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="/src/app/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar" id="toolbar"></header>
      <aside class="palette" id="palette" aria-label="Tools"></aside>
      <main class="viewport" id="viewport">
        <nav class="scene-tabs" id="scene-tabs" aria-label="Scenes" hidden></nav>
        <button type="button" class="context-badge" id="context-badge" title="Close the group (Esc)" hidden></button>
        <div class="preview-bar" id="preview-bar" role="status" hidden></div>
      </main>
      <aside class="side-panel" id="materials-panel" aria-label="Materials" hidden></aside>
      <aside class="side-panel" id="scenes-panel" aria-label="Scenes" hidden></aside>
      <aside class="side-panel" id="info-panel" aria-label="Entity Info" hidden></aside>
      <aside class="side-panel" id="history-panel" aria-label="History" hidden></aside>
      <footer class="statusbar">
        <span class="status-hint" id="status-hint"></span>
        <span class="status-hover" id="status-hover"></span>
        <span class="status-saved" id="status-saved"></span>
        <label class="measurements">
          <span id="measurements-label">Measurements</span>
          <input id="measurements" type="text" autocomplete="off" spellcheck="false" disabled />
        </label>
      </footer>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
