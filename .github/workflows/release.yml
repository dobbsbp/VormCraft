# Pushing a version tag (v0.2.0) builds the Windows installer on GitHub, signs the update with the
# private key kept in the repository secrets, and publishes a GitHub Release with latest.json,
# which installed copies of VormCraft read to find the update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: The tag matches the app version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the app version $v (run npm run version:set first)"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_END'
            node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}"
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VormCraft ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
